openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CortexOS X API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: notes
    description: Knowledge management operations
  - name: documents
    description: Document intelligence operations
  - name: tasks
    description: Task management operations
  - name: projects
    description: Project management operations
  - name: decisions
    description: Decision simulation operations
  - name: contradictions
    description: Contradiction detection operations
  - name: graph
    description: Knowledge graph operations
  - name: analytics
    description: Analytics and metrics operations
  - name: memory
    description: AI memory and timeline operations
  - name: research
    description: Research copilot operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── NOTES ───────────────────────────────────────────────────────────────────
  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List all notes
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a new note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: Created note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"

  /notes/{id}:
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteUpdate"
      responses:
        "200":
          description: Updated note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /notes/{id}/summarize:
    post:
      operationId: summarizeNote
      tags: [notes]
      summary: Generate AI summary for a note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Summary result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResult"

  /notes/stats:
    get:
      operationId: getNoteStats
      tags: [notes]
      summary: Get note statistics (counts by tag, recent activity)
      responses:
        "200":
          description: Note statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteStats"

  # ─── DOCUMENTS ────────────────────────────────────────────────────────────────
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Upload/create a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── TASKS ───────────────────────────────────────────────────────────────────
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: projectId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── PROJECTS ─────────────────────────────────────────────────────────────────
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── DECISIONS ─────────────────────────────────────────────────────────────────
  /decisions:
    get:
      operationId: listDecisions
      tags: [decisions]
      summary: List past decisions
      responses:
        "200":
          description: List of decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"

  /decisions/simulate:
    post:
      operationId: simulateDecision
      tags: [decisions]
      summary: Simulate a decision with AI analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionQuery"
      responses:
        "200":
          description: Decision analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"

  /decisions/{id}:
    delete:
      operationId: deleteDecision
      tags: [decisions]
      summary: Delete a decision
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── CONTRADICTIONS ───────────────────────────────────────────────────────────
  /contradictions:
    get:
      operationId: listContradictions
      tags: [contradictions]
      summary: List detected contradictions
      responses:
        "200":
          description: List of contradictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contradiction"

  /contradictions/detect:
    post:
      operationId: detectContradictions
      tags: [contradictions]
      summary: Run AI contradiction detection across notes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContradictionDetectInput"
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContradictionDetectionResult"

  # ─── KNOWLEDGE GRAPH ──────────────────────────────────────────────────────────
  /graph:
    get:
      operationId: getKnowledgeGraph
      tags: [graph]
      summary: Get the full knowledge graph (nodes + edges)
      responses:
        "200":
          description: Knowledge graph
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeGraph"

  /graph/rebuild:
    post:
      operationId: rebuildKnowledgeGraph
      tags: [graph]
      summary: Rebuild the knowledge graph from current notes
      responses:
        "200":
          description: Rebuild result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphRebuildResult"

  # ─── ANALYTICS ────────────────────────────────────────────────────────────────
  /analytics/dashboard:
    get:
      operationId: getAnalyticsDashboard
      tags: [analytics]
      summary: Get dashboard summary stats and charts data
      responses:
        "200":
          description: Dashboard analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsDashboard"

  /analytics/knowledge-health:
    get:
      operationId: getKnowledgeHealth
      tags: [analytics]
      summary: Get knowledge health score and breakdown
      responses:
        "200":
          description: Knowledge health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeHealth"

  # ─── MEMORY / TIMELINE ────────────────────────────────────────────────────────
  /memory:
    get:
      operationId: listMemory
      tags: [memory]
      summary: List memory entries for timeline
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryEntry"

  /memory/timeline:
    get:
      operationId: getTimeline
      tags: [memory]
      summary: Get the knowledge evolution timeline
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # ─── RESEARCH ─────────────────────────────────────────────────────────────────
  /research/query:
    post:
      operationId: researchQuery
      tags: [research]
      summary: Run a RAG-based research query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchQueryInput"
      responses:
        "200":
          description: Research result with sources and insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResearchResult"

  /research/runs:
    get:
      operationId: listResearchRuns
      tags: [research]
      summary: List saved research runs
      responses:
        "200":
          description: List of saved research runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResearchRun"

  /research/runs/{id}:
    delete:
      operationId: deleteResearchRun
      tags: [research]
      summary: Delete a saved research run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /research/multi-agent:
    post:
      operationId: multiAgentReason
      tags: [research]
      summary: Run multi-agent reasoning (6 AI perspectives)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MultiAgentQueryInput"
      responses:
        "200":
          description: Multi-agent reasoning result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MultiAgentResult"

  /research/multi-agent/runs:
    get:
      operationId: listReasoningRuns
      tags: [research]
      summary: List saved multi-agent reasoning runs
      responses:
        "200":
          description: List of saved reasoning runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReasoningRun"

  /research/multi-agent/runs/{id}:
    delete:
      operationId: deleteReasoningRun
      tags: [research]
      summary: Delete a saved reasoning run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── OPENAI CHAT ──────────────────────────────────────────────────────────────
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ─── NOTE SCHEMAS ──────────────────────────────────────────────────────────
    Note:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        summary:
          type: ["string", "null"]
        userId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - tags
        - createdAt
        - updatedAt

    NoteInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - title
        - content

    NoteUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        summary:
          type: string

    SummaryResult:
      type: object
      properties:
        summary:
          type: string
        title:
          type: ["string", "null"]
      required:
        - summary

    NoteStats:
      type: object
      properties:
        total:
          type: integer
        byTag:
          type: array
          items:
            $ref: "#/components/schemas/TagCount"
        recentCount:
          type: integer
        topTags:
          type: array
          items:
            type: string
      required:
        - total
        - byTag
        - recentCount
        - topTags

    TagCount:
      type: object
      properties:
        tag:
          type: string
        count:
          type: integer
      required:
        - tag
        - count

    # ─── DOCUMENT SCHEMAS ──────────────────────────────────────────────────────
    Document:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        fileType:
          type: string
        content:
          type: string
        userId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fileName
        - fileType
        - content
        - createdAt

    DocumentInput:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
        fileType:
          type: string
        content:
          type: string
      required:
        - fileName
        - fileType
        - content

    # ─── TASK SCHEMAS ──────────────────────────────────────────────────────────
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        priority:
          type: string
        status:
          type: string
        dueDate:
          type: ["string", "null"]
        projectId:
          type: ["integer", "null"]
        userId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - priority
        - status
        - createdAt
        - updatedAt

    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        priority:
          type: string
        status:
          type: string
        dueDate:
          type: string
        projectId:
          type: integer
      required:
        - title

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        priority:
          type: string
        status:
          type: string
        dueDate:
          type: string

    # ─── PROJECT SCHEMAS ───────────────────────────────────────────────────────
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        userId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt

    ProjectInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
        - name

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    # ─── DECISION SCHEMAS ──────────────────────────────────────────────────────
    Decision:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        pros:
          type: array
          items:
            type: string
        cons:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        opportunities:
          type: array
          items:
            type: string
        confidence:
          type: integer
        successProbability:
          type: integer
        prediction:
          type: string
        recommendedAction:
          type: string
        userId:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - question
        - pros
        - cons
        - risks
        - opportunities
        - confidence
        - successProbability
        - prediction
        - recommendedAction
        - createdAt

    DecisionQuery:
      type: object
      properties:
        question:
          type: string
          minLength: 1
      required:
        - question

    # ─── CONTRADICTION SCHEMAS ─────────────────────────────────────────────────
    Contradiction:
      type: object
      properties:
        id:
          type: integer
        noteATitle:
          type: string
        noteBTitle:
          type: string
        explanation:
          type: string
        confidence:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - noteATitle
        - noteBTitle
        - explanation
        - confidence
        - createdAt

    ContradictionDetectInput:
      type: object
      properties:
        claim:
          type: string
          description: Optional statement to check against the knowledge base. When omitted, all notes are cross-checked against each other.

    ContradictionDetectionResult:
      type: object
      properties:
        found:
          type: integer
        contradictions:
          type: array
          items:
            $ref: "#/components/schemas/Contradiction"
      required:
        - found
        - contradictions

    # ─── KNOWLEDGE GRAPH SCHEMAS ───────────────────────────────────────────────
    GraphNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        label:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required:
        - id
        - type
        - label

    GraphEdge:
      type: object
      properties:
        id:
